name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # n8n-workflow pulls the native isolated-vm, which we never execute and
      # which fails to compile on the runner. We only need its type declarations.
      - run: npm ci --ignore-scripts

      # Verification is gated on these rules, so a failure here must stop the release.
      - run: npm run lint

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
